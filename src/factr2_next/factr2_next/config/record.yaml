output_dir: data
session_name: free_motion

# Receive-only CAN bridge: scripts/piper_can_record_bridge.py.
# Record the follower's six joints; the leader supplies joint_pos_cmd.
# This namespace is assigned by the bridge, not by the CAN hardware.
robot_topic_root: /next_capture/piper_x_follower

sync:
  queue_size: 20
  slop_seconds: 0.03

recording:
  target_hz: 50.0
  min_hz: 45.0
  sample_timeout_seconds: 0.2
  warn_after_seconds: 2.0

# Synchronized samples are cached, then rows are written by a fixed-rate timer:
# ep_0000/<key>/data and ep_0000/<key>/timestamps.
topics:
  joint_pos:
    topic: "{robot_topic_root}/joint_pos_obs"
    field: position

  joint_vel:
    topic: "{robot_topic_root}/joint_vel_obs"
    field: position

  joint_cmd:
    topic: "{robot_topic_root}/joint_pos_cmd"
    field: position

  # Bridge publishes pyAgxArm Piper X current-derived torque (Nm) in position.
  measured_joint_torque:
    topic: "{robot_topic_root}/joint_effort_obs"
    field: position
